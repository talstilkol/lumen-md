# The public live-share server (plan W4.8): Cloudflare Workers + Durable
# Objects on the Workers Free plan. Deploy: `npm run collab:deploy`
# (docs: collab/public-server).
name = "lumen-collab"
main = "worker.mjs"
compatibility_date = "2025-06-01"
# node:crypto (HMAC room tokens) and Buffer, used by sync-server/collab/roomToken.mjs.
compatibility_flags = ["nodejs_compat"]

# No request logs: the server keeps no IP addresses (PRIVACY.he.md, W4.29).
[observability]
enabled = false

[vars]
# Delete a room nobody changed for this many days.
RETENTION_DAYS = "90"
# A room's encrypted document may grow to this size.
MAX_ROOM_BYTES = "4000000"
COLLAB_TOKEN_TTL_S = "600"
# Review 2 (12.11): without COLLAB_ACCESS_KEY a token needs the room proof
# (from the room's password) and a proof of work of this many bits for it,
# which the app solves once per room and session (at most 24).
COLLAB_POW_BITS = "18"
# New rooms (review 2 RR2-469-1, sync-server/collab/roomQuota.mjs): per UTC day on the
# whole server, per client address (IPv4, or IPv6 /64) and per IPv6 /48; and the
# rooms stored at once (1,000 × MAX_ROOM_BYTES = 4 GB, under the Free plan's 5 GB).
COLLAB_NEW_ROOMS_PER_DAY = "2000"
COLLAB_NEW_ROOMS_PER_ADDRESS = "20"
COLLAB_NEW_ROOMS_PER_48 = "80"
COLLAB_MAX_ROOMS = "1000"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CollabRoom"

[[durable_objects.bindings]]
name = "SIGNAL"
class_name = "Signal"

# One counter for the new-room limits (a global, exact count: the rate-limit
# binding counts per location and only per 10 or 60 seconds).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

# SQLite-backed Durable Objects are the ones the Free plan includes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CollabRoom", "Signal"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Quota"]

# Secrets (`wrangler secret put`, done by scripts/collab-deploy.mjs):
#   COLLAB_TOKEN_SECRET   ≥ 32 random characters; signs the room tokens
#   COLLAB_ACCESS_KEY     optional; when set, only people with the key get tokens
