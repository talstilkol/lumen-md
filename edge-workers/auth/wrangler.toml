name = "lumen-auth"
main = "worker.ts"
compatibility_date = "2026-04-27"

# Same-site requirement: the worker's cookies must be first-party for the
# app, or Safari drops them (sign-in fails with state_mismatch). The app is
# on lumen-md.vercel.app and has no custom domain, so a workers.dev host is
# a different site. Serve the worker through the app's own host instead:
# deploy it (it gets https://lumen-auth.<account>.workers.dev), then add a
# Vercel rewrite in vercel.json:
#   { "source": "/api/sso/:path*",   (place it before the SPA rewrite)
#     "destination": "https://lumen-auth.<account>.workers.dev/api/sso/:path*" }
# and build the app with VITE_WORKOS_ENDPOINT=https://lumen-md.vercel.app.
# Calling the workers.dev host directly is for local testing only.

[vars]
# Comma-separated app origins allowed to start SSO / read the session.
# Credentialed CORS never uses `*`, so every origin must be listed.
ALLOWED_ORIGINS = "https://lumen-md.vercel.app"
# Optional: explicit callback URL registered in the WorkOS dashboard.
# Defaults to `<worker origin>/api/sso/callback`.
# WORKOS_REDIRECT_URI = "https://lumen-md.vercel.app/api/sso/callback"
# Optional: session lifetime in seconds (default 604800 = 7 days).
# SESSION_TTL_SECONDS = "604800"

# Required secrets (set via `wrangler secret put <NAME>`):
#   WORKOS_API_KEY    — sk_live_… / sk_test_… from WorkOS → API Keys
#   WORKOS_CLIENT_ID  — client_… from WorkOS → API Keys
#   SESSION_SECRET    — ≥32 random bytes, e.g. `openssl rand -base64 48`
# Optional:
#   BILLING_TOKEN_SECRET — enables GET /api/sso/token for the billing worker;
#                          must equal billing's SSO_TOKEN_SECRET, differ from SESSION_SECRET
