name = "lumen-publish"
main = "worker.ts"
compatibility_date = "2026-04-01"
account_id = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"

# Served at the default https://lumen-publish.<account>.workers.dev (no custom
# domain). To use one later, add a routes = [...] entry for it.

# KV namespace — create with `wrangler kv:namespace create PUBLISHED`,
# then paste the resulting id below.
[[kv_namespaces]]
binding = "PUBLISHED"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Required secrets (`wrangler secret put`):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE
