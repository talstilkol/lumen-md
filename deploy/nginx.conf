worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript
                text/xml application/xml application/xml+rss text/javascript
                image/svg+xml application/wasm;
    gzip_min_length 1024;
    gzip_vary       on;

    # Security headers. Values come from security/policy.json
    # (`npm run headers:write`; CI checks for drift). A location with an
    # add_header of its own inherits none of these, so locations that set
    # headers repeat the ones they need.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.tldraw.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' blob: data: ws: wss: https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.mistral.ai http://localhost:11434 http://127.0.0.1:11434 http://localhost:8787 http://127.0.0.1:8787 http://localhost:8010 http://127.0.0.1:8010 https://api.languagetool.org https://kroki.io https://oauth2.googleapis.com https://www.googleapis.com https://api.dropboxapi.com https://content.dropboxapi.com https://github.com https://api.github.com https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://*.hf.co https://raw.githubusercontent.com https://cdn.tldraw.com https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.supabase.co https://*.sentry.io __CSP_CONNECT_EXTRA__; worker-src 'self' blob:; frame-src 'self' data: https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com https://codepen.io https://codesandbox.io https://www.figma.com https://open.spotify.com https://www.google.com https://maps.google.com https://www.openstreetmap.org https://platform.twitter.com https://www.facebook.com https://www.instagram.com https://www.tiktok.com https://www.redditmedia.com https://www.reddit.com https://www.linkedin.com https://gist.github.com https://w.soundcloud.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types lumen default dompurify lit-html iconify ProseMirrorClipboard 'allow-duplicates'" always;
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "interest-cohort=(), geolocation=(), microphone=(self), camera=()" always;

    # Cross-Origin Isolation headers required for SharedArrayBuffer
    # (used by WASM modules — Mermaid, Graphviz, future WebGPU). This image
    # only; the cost (embeds without COEP don't load) is in
    # docs/security/headers.md (D9).
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — any path that isn't a real file gets index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Clean URL aliases for static pages
        location = /roadmap  { try_files /roadmap.html =404; }
        location = /landing  { try_files /landing.html =404; }
        location = /benchmarks { try_files /benchmarks.html =404; }

        # Cache immutable hashed assets aggressively (1 year)
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Web Playground runner (origin "null") loads chunks with CORS.
            add_header Access-Control-Allow-Origin "*";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
        }

        # Web Playground runner + its self-hosted React / Vue copies.
        location = /playground-runner.html {
            add_header Cache-Control "no-cache";
            add_header Content-Security-Policy "default-src 'none'; script-src 'self' blob: 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "interest-cohort=(), geolocation=(), microphone=(self), camera=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
        }

        # live-js runner (T48): hidden sandboxed iframe for live-js code — no
        # network for the user's code, framed by the app only.
        location = /livejs-runner.html {
            add_header Cache-Control "no-cache";
            add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'nonce-lumen-livejs-runner' blob: 'unsafe-eval'; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "interest-cohort=(), geolocation=(), microphone=(self), camera=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
        }

        # On-device OCR (T31): tesseract.js worker + wasm cores; a worker
        # takes the CSP of its own response.
        location ^~ /tesseract/ {
            add_header Cache-Control "no-cache";
            add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://raw.githubusercontent.com; worker-src 'self' blob:; base-uri 'none'; form-action 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
            try_files $uri =404;
        }

        # Workers that need eval (Graphviz embind, ruby.wasm, TypeScript
        # checker): a worker takes the CSP of its own response; the page
        # allows no eval. (A regex location wins over the /assets/ prefix.)
        location ~ ^/assets/(graphviz|ruby|tsCheck)\.worker- {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
            try_files $uri =404;
        }

        location ^~ /playground/ {
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
        }

        # Service worker must not be cached
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location = /registerSW.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Manifest + favicon — short TTL so PWA updates propagate
        location = /manifest.json {
            add_header Cache-Control "public, max-age=3600";
        }

        # Self-hosted language runtimes (webR, ruby.wasm, Pyodide) keep FIXED
        # file names across versions, so they must revalidate: an immutable
        # year-long cache would pair a stale R.wasm / ruby+stdlib.wasm with
        # the upgraded runtime JS. `^~` wins over the .wasm regex below.
        # (A location's add_header replaces the http-level ones: repeat them.)
        location ^~ /webr/    { include /etc/nginx/lumen-runtime-headers.conf; }
        location ^~ /ruby/    { include /etc/nginx/lumen-runtime-headers.conf; }
        location ^~ /pyodide/ { include /etc/nginx/lumen-runtime-headers.conf; }

        # WASM files (other than the runtimes above)
        location ~* \.wasm$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            types { application/wasm wasm; }
        }
    }
}
