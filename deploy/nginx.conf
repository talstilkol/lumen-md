worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    gzip        on;
    gzip_types  text/plain text/css application/json application/javascript
                text/xml application/xml application/xml+rss text/javascript
                image/svg+xml application/wasm;
    gzip_min_length 1024;
    gzip_vary       on;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(self), geolocation=()" always;

    # Cross-Origin Isolation headers required for SharedArrayBuffer
    # (used by WASM modules — Mermaid, Graphviz, future WebGPU)
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — any path that isn't a real file gets index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Clean URL aliases for static pages
        location = /roadmap  { try_files /roadmap.html =404; }
        location = /landing  { try_files /landing.html =404; }
        location = /benchmarks { try_files /benchmarks.html =404; }

        # Cache immutable hashed assets aggressively (1 year)
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Service worker must not be cached
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location = /registerSW.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Manifest + favicon — short TTL so PWA updates propagate
        location = /manifest.json {
            add_header Cache-Control "public, max-age=3600";
        }

        # WASM files
        location ~* \.wasm$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            types { application/wasm wasm; }
        }
    }
}
