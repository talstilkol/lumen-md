# Included by deploy/nginx.conf for /webr/, /ruby/ and /pyodide/.
# webR's worker (/webr/webr-worker.js) needs eval (Emscripten EM_ASM,
# webr::eval_js); a worker takes the CSP of its own response, so only these
# paths allow it. Value from security/policy.json (route eval-workers).
add_header Cache-Control "no-cache" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
types { application/wasm wasm; application/javascript js mjs; application/json json; }
try_files $uri =404;
