# Local AI services for Lumen — nothing here talks to a third party except
# SearXNG's upstream search engines (it is a metasearch proxy).
#
#   docker compose -f docker/local-ai.yml up -d
#
# Then in Lumen:
#   ⌘K → Research: Settings → "SearXNG on this machine" → http://localhost:8787
#   build with VITE_LANGUAGETOOL_URL=http://localhost:8010/v2/check (or set it
#   in the AI settings panel) for grammar checks on this machine.
#
# Ports: 8787 research service (search + page extraction), 8888 SearXNG,
# 8010 LanguageTool. Lumen's CSP allows localhost/127.0.0.1 on 8787 and 8010.
services:
  searxng:
    image: searxng/searxng:latest
    ports: ["8888:8080"]
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  research:
    # The same Cloudflare worker Lumen deploys (edge-workers/research), run
    # locally with wrangler. It extracts pages and queries SearXNG — no keys.
    image: node:22-alpine
    working_dir: /app/edge-workers/research
    volumes:
      - ../:/app
    command: >
      npx --yes wrangler@4 dev --ip 0.0.0.0 --port 8787
      --var ALLOWED_ORIGINS:https://lumen-md.vercel.app,http://localhost:5173,http://localhost:4173
      --var SEARXNG_URL:http://searxng:8080
    ports: ["8787:8787"]
    depends_on: [searxng]
    restart: unless-stopped

  languagetool:
    image: erikvl87/languagetool:latest
    ports: ["8010:8010"]
    environment:
      - Java_Xms=512m
      - Java_Xmx=1g
    restart: unless-stopped
