# nginx config for the on-prem Lumen web shell.
# Mounted at /etc/nginx/conf.d/default.conf inside the lumen-web container.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets; everything Vite emits gets a content hash.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker + manifest must always be revalidated.
  location ~ ^/(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA fallback — everything else routes back to index.html.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }

  # Strict CSP for self-hosted deployments. __CSP_CONNECT_EXTRA__ is replaced
  # in docker/Dockerfile.web with the origins of the VITE_*_ENDPOINT workers
  # the image was built with (see src/build/cspEndpoints.ts).
  add_header Content-Security-Policy "default-src 'self'; \
    script-src 'self' 'wasm-unsafe-eval'; \
    style-src 'self' 'unsafe-inline' fonts.googleapis.com; \
    font-src 'self' data: fonts.gstatic.com; \
    img-src 'self' data: blob: https:; \
    connect-src 'self' blob: data: ws: wss: https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.mistral.ai http://localhost:11434 http://127.0.0.1:11434 https://api.languagetool.org https://kroki.io https://oauth2.googleapis.com https://www.googleapis.com https://api.dropboxapi.com https://content.dropboxapi.com https://github.com https://api.github.com https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://*.hf.co https://raw.githubusercontent.com https://cdn.tldraw.com https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.supabase.co https://*.sentry.io __CSP_CONNECT_EXTRA__; \
    frame-src 'self' blob: https:; \
    worker-src 'self' blob:; \
    object-src 'none';" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
}
