# nginx config for the on-prem Lumen web shell.
# Mounted at /etc/nginx/conf.d/default.conf inside the lumen-web container.
# Every Content-Security-Policy / security header value below comes from
# security/policy.json (`npm run headers:write`; CI checks for drift).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets; everything Vite emits gets a content hash.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # The Web Playground runner (opaque origin "null") loads module chunks
    # with CORS; these are public, credential-free files.
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }

  # Service worker + manifest must always be revalidated.
  location ~ ^/(sw\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Self-hosted language runtimes (staged by scripts/copy-{pyodide,webr,ruby}.mjs).
  # Fixed file names: revalidate instead of no-store, so the browser and the
  # service worker's runtime cache can keep them for offline use.
  # A location's add_header replaces the server-level ones, so the security
  # headers are repeated here. webR's worker script (/webr/webr-worker.js)
  # needs JavaScript eval (Emscripten), which the page's strict CSP below
  # doesn't grant: a worker takes the CSP of its own script response, so
  # only this path allows 'unsafe-eval'.
  location ~ ^/(webr|ruby|pyodide|playground)/ {
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Web Playground runner: the page inside the block's sandboxed iframe. It
  # runs the user's project, so it gets its own policy (blob: modules, eval
  # for Vue's compiler) and may be framed by the app only.
  location = /playground-runner.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' blob: 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=(), geolocation=(), microphone=(self), camera=()" always;
    try_files $uri =404;
  }

  # live-js runner (T48): hidden sandboxed iframe for live-js code — no
  # network for the user's code, framed by the app only.
  location = /livejs-runner.html {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'nonce-lumen-livejs-runner' blob: 'unsafe-eval'; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=(), geolocation=(), microphone=(self), camera=()" always;
    try_files $uri =404;
  }

  # On-device OCR (T31): tesseract.js worker + wasm cores; language models
  # come from raw.githubusercontent.com on first use.
  location ^~ /tesseract/ {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://raw.githubusercontent.com; worker-src 'self' blob:; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Workers that need eval (Graphviz embind, ruby.wasm, TypeScript checker):
  # a worker takes the CSP of its own response; the page allows no eval.
  location ~ ^/assets/(graphviz|ruby|tsCheck)\.worker- {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA fallback — everything else routes back to index.html.
  # The app's security headers live here, not at server level: a location
  # with any add_header of its own (this one sets Cache-Control) inherits
  # none from the server, so server-level headers never reached the page.
  # __CSP_CONNECT_EXTRA__ is replaced in docker/Dockerfile.web with the
  # origins of the VITE_*_ENDPOINT workers the image was built with (see
  # src/build/cspEndpoints.ts). Policy values: security/policy.json.
  location / {
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.tldraw.com; img-src 'self' data: blob: https://cdn.tldraw.com https://*.tile.openstreetmap.org https://avatars.githubusercontent.com https://*.googleusercontent.com https:; media-src 'self' blob: https:; connect-src 'self' blob: data: ws: wss: https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.mistral.ai http://localhost:11434 http://127.0.0.1:11434 http://localhost:8787 http://127.0.0.1:8787 http://localhost:8010 http://127.0.0.1:8010 https://api.languagetool.org https://kroki.io https://oauth2.googleapis.com https://www.googleapis.com https://api.dropboxapi.com https://content.dropboxapi.com https://github.com https://api.github.com https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://*.hf.co https://raw.githubusercontent.com https://cdn.tldraw.com https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.supabase.co https://*.sentry.io __CSP_CONNECT_EXTRA__; worker-src 'self' blob:; frame-src 'self' data: https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com https://codepen.io https://codesandbox.io https://www.figma.com https://open.spotify.com https://www.google.com https://maps.google.com https://www.openstreetmap.org https://platform.twitter.com https://www.facebook.com https://www.instagram.com https://www.tiktok.com https://www.redditmedia.com https://www.reddit.com https://www.linkedin.com https://gist.github.com https://w.soundcloud.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types lumen default dompurify lit-html iconify ProseMirrorClipboard 'allow-duplicates'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=(), geolocation=(), microphone=(self), camera=()" always;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
}
