<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP rendered from security/policy.json (npm run headers:write). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.tldraw.com; img-src 'self' data: blob: https://cdn.tldraw.com https://*.tile.openstreetmap.org https://avatars.githubusercontent.com https://*.googleusercontent.com https:; media-src 'self' blob: https:; connect-src 'self' blob: data: wss://signal.lumen.md wss://signaling.yjs.dev wss://y-webrtc-signaling-eu.herokuapp.com https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.mistral.ai http://localhost:11434 http://127.0.0.1:11434 http://localhost:8787 http://127.0.0.1:8787 http://localhost:8010 http://127.0.0.1:8010 https://api.languagetool.org https://kroki.io https://oauth2.googleapis.com https://www.googleapis.com https://api.dropboxapi.com https://content.dropboxapi.com https://github.com https://api.github.com https://huggingface.co https://*.huggingface.co https://cdn-lfs.huggingface.co https://*.hf.co https://raw.githubusercontent.com https://cdn.tldraw.com https://www.gstatic.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.supabase.co https://*.sentry.io; worker-src 'self' blob:; frame-src 'self' data: https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://www.loom.com https://codepen.io https://codesandbox.io https://www.figma.com https://open.spotify.com https://www.google.com https://maps.google.com https://www.openstreetmap.org https://platform.twitter.com https://www.facebook.com https://www.instagram.com https://www.tiktok.com https://www.redditmedia.com https://www.reddit.com https://www.linkedin.com https://gist.github.com https://w.soundcloud.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- The saved theme, applied before the boot shell paints (no inline
         script: the CSP forbids it). -->
    <script src="/theme-boot.js"></script>
    <meta name="description" content="Lumen — the markdown editor that turns text and data into beautiful documents." />
    <title>Lumen — Markdown, illuminated</title>
    <!-- SEO & Social -->
    <meta property="og:title" content="Lumen — Markdown, illuminated" />
    <meta property="og:description" content="Free, open-source markdown editor with live preview, diagrams, charts, AI, collaboration, and 30+ export formats." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lumen.md" />
    <meta property="og:image" content="https://lumen.md/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumen — Markdown, illuminated" />
    <meta name="twitter:description" content="Free, open-source markdown editor with live preview, diagrams, charts, AI, and collaboration." />
    <meta name="twitter:image" content="https://lumen.md/og-image.png" />
    <link rel="canonical" href="https://lumen.md" />
    <!-- PWA -->
    <meta name="theme-color" content="#7c5cfc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Lumen",
      "url": "https://lumen.md",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web, iOS, Android",
      "description": "Free, open-source markdown editor with live preview, diagrams, charts, AI, collaboration, and 30+ export formats.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <!-- Fonts are self-hosted (src/fonts.ts): no request to Google, and
         they work offline from the first visit. -->
    <style>
      .boot-shell{position:fixed;inset:0;background:#0f1115;color:#e7e9ee;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
      html:not(.dark) .boot-shell{background:#fafafa;color:#1c1f24}
      .boot-bar{height:44px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(127,127,127,.2)}
      .boot-logo{font-weight:700;letter-spacing:.02em}
      .boot-page{max-width:720px;margin:48px auto;padding:0 20px;display:flex;flex-direction:column;gap:14px}
      .boot-line{height:12px;border-radius:6px;background:rgba(127,127,127,.18)}
      .boot-line.w60{width:60%;height:22px}.boot-line.w80{width:80%}.boot-line.w70{width:70%}
      @media (prefers-reduced-motion:no-preference){.boot-line{animation:boot 1.2s ease-in-out infinite alternate}}
      @keyframes boot{to{opacity:.5}}
    </style>
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root">
      <!-- Boot shell (C1): painted before any JavaScript runs; React replaces
           it on first render. Colours follow the saved theme via the class
           set by /theme-boot.js in <head>, falling back to dark. -->
      <div class="boot-shell" aria-hidden="true">
        <div class="boot-bar"><span class="boot-logo">Lumen</span></div>
        <div class="boot-page"><div class="boot-line w60"></div><div class="boot-line"></div><div class="boot-line w80"></div><div class="boot-line w70"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
