<!doctype html>
<html><head><meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'nonce-probe' blob: data: 'unsafe-eval'; worker-src blob: data: 'self'; connect-src 'none'; img-src 'none'; style-src 'none'; base-uri 'none'; form-action 'none'" />
</head><body>
<script nonce="probe">
// TEMPORARY CI probe (fix/livejs-worker-csp): what blocks a dynamic import()
// from a worker started inside the opaque-origin live-js runner, per engine.
const EVIL = "https://evil.lumen-e2e.test/";
const out = {};
const body = (tag) => `
  const r = {};
  const t = (k, f) => Promise.resolve().then(f).then(() => { r[k] = "ok"; }, (e) => { r[k] = "err:" + (e && e.name); });
  Promise.all([
    t("import", () => import("${EVIL}${tag}-import.js")),
    t("fetch", () => fetch("${EVIL}${tag}-fetch")),
    t("fnImport", () => new Function("return import('${EVIL}${tag}-fn.js')")()),
    t("importScripts", () => { if (typeof importScripts === "function") importScripts("${EVIL}${tag}-is.js"); else throw { name: "n/a" }; }),
  ]).then(() => postMessage(r));`;
function run(tag, make) {
  return new Promise((res) => {
    let w;
    try { w = make(body(tag)); } catch (e) { out[tag] = "create:" + e.name; return res(); }
    const timer = setTimeout(() => { out[tag] = out[tag] || "timeout"; res(); }, 8000);
    w.onmessage = (e) => { out[tag] = e.data; clearTimeout(timer); res(); };
    w.onerror = (e) => { out[tag] = "onerror:" + (e.message || "?"); clearTimeout(timer); e.preventDefault(); res(); };
  });
}
const blobUrl = (src) => URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
const dataUrl = (src) => "data:text/javascript," + encodeURIComponent(src);
(async () => {
  await run("blobClassic", (s) => new Worker(blobUrl(s)));
  await run("blobModule", (s) => new Worker(blobUrl(s), { type: "module" }));
  await run("dataClassic", (s) => new Worker(dataUrl(s)));
  await run("dataModule", (s) => new Worker(dataUrl(s), { type: "module" }));
  await run("urlWorker", () => new Worker("/__probe/worker.js"));
  try { await import(EVIL + "doc-import.js"); out.docImport = "ok"; } catch (e) { out.docImport = "err:" + e.name; }
  out.origin = String(self.origin);
  parent.postMessage({ probe: out }, "*");
})();
</script></body></html>
