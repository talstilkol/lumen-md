# Category "Show and tell · הראו מה בניתם" (default slug show-and-tell). See docs/dev/github-discussions.md.
title: "[הצגה] "
body:
  - type: markdown
    attributes:
      value: |
        כספת, תבנית, תוסף או זרימת עבודה שבניתם עם Lumen — שתפו. בלי מידע אישי, בבקשה.
        A vault, template, plugin or workflow you built with Lumen. Please leave out personal data.
  - type: textarea
    id: what
    attributes:
      label: מה בניתם? · What you built
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: קישור (לא חובה) · Link (optional)
    validations:
      required: false
