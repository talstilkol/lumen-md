# Plan W2.25: beta feedback (category slug: beta-feedback). Each report is
# triaged with the 14.3 labels; the beta's goal is >= 30 triaged reports.
title: "משוב: "
labels: ["beta", "feedback"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: "סוג / Kind"
      options: ["באג · Bug", "רעיון · Idea", "עברית ו-RTL · Hebrew & RTL", "שאלה · Question"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "מה קרה, ומה ציפיתם שיקרה? / What happened, and what did you expect?"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: "איפה (גרסה, מכשיר, דפדפן) / Where (version, device, browser)"
