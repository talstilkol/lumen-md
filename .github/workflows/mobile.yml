name: Mobile

# Android and iOS builds on every pull request (plan 13.3): the Capacitor
# projects in android/ and ios/ wrap the same dist/ the web hosts serve.
#
# Without the store accounts (plan 15.7) the builds are unsigned and still
# prove the native projects compile against the current web build: a debug
# APK (debug-key signed, installable), an unsigned release APK and an unsigned
# IPA are uploaded as artifacts. With the signing secrets set, the same jobs
# also produce a signed release APK and a signed IPA — the release pipeline
# (13.4) publishes those. Nothing here needs the secrets to go green.
#
# Secrets (all optional):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
#   IOS_PROVISIONING_PROFILE_NAME, APPLE_TEAM_ID
#
# Every action is pinned to a full commit SHA, with its version as a comment.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  android:
    name: Android APK
    # Pinned image, not -latest: a runner upgrade must not change what passes.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # `secrets` cannot be read in a step's `if`; the job env can.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Capacitor sync (copies dist/ into the Android project)
        run: npx cap sync android
      - name: Debug APK (debug-key signed, installable)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      # Signing is optional (15.7): with the secrets the release APK is signed,
      # without them Gradle still emits app-release-unsigned.apk.
      - name: Release keystore from the secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Release APK (signed when the keystore exists, otherwise unsigned)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: What was built
        run: |
          ls -la android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/release/*.apk
          echo "::notice title=Android::$(ls android/app/build/outputs/apk/release/*.apk | xargs -n1 basename | tr '\n' ' ')$([ -n "${ANDROID_KEYSTORE_PATH:-}" ] && echo '(signed)' || echo '(unsigned: no keystore secret, 15.7)')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  ios:
    name: iOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    env:
      ARCHIVE: ${{ github.workspace }}/build/Lumen.xcarchive
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Capacitor sync (copies dist/ into the iOS project, resolves the Swift packages)
        run: npx cap sync ios
      # Signing is optional (15.7): with the secrets the archive is signed and
      # exported as an IPA for App Store Connect; without them the archive is
      # built unsigned and zipped into an unsigned IPA, which proves the build.
      - name: Signing certificate and profile from the secrets
        if: env.HAS_SIGNING == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/lumen.mobileprovision
          echo "IOS_SIGNED=1" >> "$GITHUB_ENV"
      - name: Archive (unsigned without the secrets)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [ "${IOS_SIGNED:-}" = 1 ]; then
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
              -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" archive \
              CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
              -skipPackagePluginValidation
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
              -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              -skipPackagePluginValidation
          fi
      - name: IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          mkdir -p build/ipa
          if [ "${IOS_SIGNED:-}" = 1 ]; then
            sed -e "s/__TEAM_ID__/$APPLE_TEAM_ID/" -e "s/__PROFILE_NAME__/$IOS_PROVISIONING_PROFILE_NAME/" ios/exportOptions.plist > build/exportOptions.plist
            xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist build/exportOptions.plist -exportPath build/ipa
            echo "::notice title=iOS::signed IPA: $(ls build/ipa/*.ipa | xargs -n1 basename)"
          else
            # An IPA is a zip with Payload/<app>.app; unsigned it installs nowhere but proves the build.
            mkdir -p build/Payload
            cp -R "$ARCHIVE/Products/Applications/App.app" build/Payload/
            (cd build && zip -qry ipa/Lumen-unsigned.ipa Payload)
            echo "::notice title=iOS::unsigned IPA (no signing secrets, 15.7): $(du -h build/ipa/Lumen-unsigned.ipa | cut -f1)"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-ios
          path: build/ipa/*.ipa
          retention-days: 14
