name: Release

# Triggered by pushing a tag of the form `v*` (e.g. `v0.2.0`). The job
# matrix builds web + Tauri desktop bundles for macOS / Windows / Linux,
# uploads each to the resulting GitHub Release.
#
# iOS + Android builds are NOT included here — signing keys live on
# developer machines. See RELEASE.md sections 3 + 4 for those flows.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: write    # needed to create a Release + upload assets

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm run typecheck && npm run test
      - run: npm run build
      - run: npm run budget
      - name: Tar the dist folder
        run: tar -czf lumen-web-${{ github.ref_name }}.tgz -C dist .
      - uses: softprops/action-gh-release@v3
        with:
          files: lumen-web-${{ github.ref_name }}.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true

  tauri:
    name: Tauri ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14         # Apple Silicon
            arch: aarch64-apple-darwin
            artifact: "src-tauri/target/*/release/bundle/dmg/*.dmg"
          - os: macos-13         # Intel
            arch: x86_64-apple-darwin
            artifact: "src-tauri/target/*/release/bundle/dmg/*.dmg"
          - os: ubuntu-22.04
            arch: x86_64-unknown-linux-gnu
            artifact: "src-tauri/target/*/release/bundle/{appimage,deb,rpm}/*"
          - os: windows-latest
            arch: x86_64-pc-windows-msvc
            artifact: "src-tauri/target/*/release/bundle/{msi,nsis}/*"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libsoup-3.0-dev javascriptcoregtk-4.1-dev
      - run: npm ci || npm install
      - name: Build Tauri bundle
        run: npm run tauri:build -- --target ${{ matrix.arch }}
        env:
          # Optional Apple notarisation. CI skips signing when secrets aren't
          # configured (the build still succeeds — just ad-hoc signed).
          APPLE_ID:                ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:          ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:           ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY:  ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: false
