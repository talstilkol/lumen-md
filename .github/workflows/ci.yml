name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage gate (lines >= 40%)
        # The old 60% gate was passing only because v8 coverage was
        # accidentally counting executed node_modules code (3500+ entries,
        # inflating the ratio to a meaningless 97%). Round-25 scoped
        # coverage to first-party `src/**` via vite.config (correct), and
        # the *honest* measurement on the current test suite is ~42% —
        # the un-unit-testable UI surfaces (src/ui, src/editor, src/layouts,
        # src/components) are explicitly excluded and covered by the 90+
        # Playwright e2e specs instead. 40% is the truthful floor.
        run: |
          npm run test:coverage
          pct=$(node -e 'console.log(require("./coverage/coverage-summary.json").total.lines.pct)')
          echo "Coverage lines: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p < 40) }' || (echo "::error::Lines coverage $pct% < 40% gate" && exit 1)

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run budget

      - name: i18n drift gate
        # Vitest already runs the i18nStrings test — this step also asserts
        # that en + he stay within 10 keys of each other (catches lazy
        # ports of new keys to one bundle and not the other).
        run: |
          node scripts/extract-i18n-keys.mjs > /dev/null
          en_count=$(node -e 'const j=JSON.parse(require("fs").readFileSync("i18n/keys.json","utf8")); console.log(j.entries.length)')
          # Count keys in `he` block via the same regex the test uses.
          he_count=$(node -e '
            const fs=require("fs");
            const t=fs.readFileSync("src/i18n/index.ts","utf8");
            const m=t.match(/const he:\s*Strings\s*=\s*\{([\s\S]+?)^\};/m);
            const keys=m[1].match(/"\w[\w.\-]+"/g);
            console.log(keys ? keys.length : 0);
          ')
          diff=$(( en_count > he_count ? en_count - he_count : he_count - en_count ))
          echo "i18n keys — en: $en_count, he: $he_count, diff: $diff"
          if [ "$diff" -gt 10 ]; then
            echo "::error::i18n drift > 10 keys; run `node scripts/print-missing-i18n-keys.mjs` and fix."
            exit 1
          fi

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    # Lighthouse runs are slow + flaky on cold runners. Only required on
    # explicit triggers — main pushes and `lighthouse` PR labels — so day-to-day
    # PRs still get fast feedback from `check`.
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'lighthouse')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm run build
      - name: Lighthouse CI
        run: npx -y @lhci/cli@0.13.x autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  e2e:
    # Per-browser matrix: each browser runs in its own runner so the
    # three (chromium / firefox / webkit) execute in parallel. Before
    # this split, all three ran sequentially in one job and took 30+
    # minutes — past the timeout. Now each is ~10 min wall-clock, and
    # one failing browser doesn't cancel the others.
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Each browser independently: install + dev server cold-start +
    # tests. The dev server is slow on the Linux runner (~3 min to come
    # up vs. the prod static server's < 1s), so 20 min wasn't quite
    # enough for the slower browsers. 30 min gives comfortable headroom.
    timeout-minutes: 30
    needs: check
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }} --reporter=line
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/

  e2e-prod:
    name: e2e against production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    # Vite dev mode and `vite preview` chunk modules differently;
    # round-16 found a critical TDZ that only fires in the prod
    # bundle. This job builds and serves the dist/ output, then
    # runs the same e2e suite against it — so the prod-bundle bug
    # class is regression-tested on every PR.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - name: Install Playwright browsers (chromium only — saves ~6 min)
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Serve dist with http-server
        run: |
          npx -y http-server@14 dist -p 5180 -c-1 --silent &
          # Wait for server to come up.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5180/ -o /dev/null; then
              echo "Server up."
              break
            fi
            sleep 1
          done
      - name: Run E2E against prod bundle
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5180
        run: npx playwright test --project=chromium --reporter=line
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod
          path: playwright-report/

  signal-health:
    name: signaling server health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Only on main pushes — the signaling server must be deployed first.
    if: github.event_name == 'push'
    steps:
      - name: Healthcheck
        run: |
          URL="${SIGNAL_URL:-https://signal.lumen.md}"
          echo "Checking $URL/health..."
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$URL/health" || true)
          if [ "$status" = "200" ]; then
            echo "✅ Signal server healthy ($status)"
          else
            echo "::warning::Signaling server unreachable (HTTP $status). Deploy pending."
          fi
        env:
          SIGNAL_URL: ${{ vars.SIGNAL_URL || 'https://signal.lumen.md' }}
