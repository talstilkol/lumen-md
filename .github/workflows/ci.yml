name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: stacked PRs (a feature branch
  # on top of another) were getting no CI at all with `branches: [main]`.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: this job runs the PR's code. The comment is posted by
    # bundle-comment below, which runs none of it.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Code hygiene (no `as any` / console.log in production src)
        run: npm run hygiene

      # plan/plan.json is the plan's source (plan 0.6): the board in
      # MASTER_PLAN.md and plan/board.html must be what it generates.
      - name: Plan matches plan/plan.json
        run: npm run plan:check

      # Plan 0.7: every task marked ✅ re-runs the commands that proved it
      # (its `dod` in plan/plan.json), so a regression un-✅s it here.
      - name: Definition of done for every ✅ task
        run: npm run dod -- --done

      - name: Test
        run: npm run test

      - name: Coverage gate (lines >= 65%)
        # Measured on 17.10.2026 with src/ui and src/editor *included*
        # (they used to be excluded): 66.7% lines. The gate sits just
        # under the honest measurement, so it can only go up with real
        # tests — never by excluding code that is hard to test.
        run: |
          npm run test:coverage
          pct=$(node -e 'console.log(require("./coverage/coverage-summary.json").total.lines.pct)')
          echo "Coverage lines: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p < 65) }' || (echo "::error::Lines coverage $pct% < 65% gate" && exit 1)

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run budget -- --json bundle-sizes.json

      # Sizes on main are kept in the Actions cache; a PR compares its own
      # against the newest main record and reports the change.
      - name: Record bundle sizes (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdir -p .bundle-base && cp bundle-sizes.json .bundle-base/
      - name: Save bundle sizes (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .bundle-base
          key: bundle-sizes-${{ github.sha }}
      - name: Restore main's bundle sizes
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/cache/restore@v5
        with:
          path: .bundle-base
          key: bundle-sizes-${{ github.event.pull_request.base.sha }}
          restore-keys: bundle-sizes-
      - name: Bundle-size change
        if: github.event_name == 'pull_request' && (success() || failure())
        run: |
          node scripts/bundle-diff.mjs .bundle-base/bundle-sizes.json bundle-sizes.json main > bundle-diff.md
          cat bundle-diff.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle-size change
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/upload-artifact@v7
        with:
          name: bundle-diff
          path: bundle-diff.md
          retention-days: 3

      - name: i18n drift gate
        # Vitest already runs the i18nStrings test — this step also asserts
        # that en + he (src/i18n/locales/he.json) stay within 10 keys of each other (catches lazy
        # ports of new keys to one bundle and not the other).
        run: |
          # The committed manifest feeds translation tooling: it must match.
          node scripts/extract-i18n-keys.mjs --check
          node scripts/extract-i18n-keys.mjs > /dev/null
          en_count=$(node -e 'const j=JSON.parse(require("fs").readFileSync("i18n/keys.json","utf8")); console.log(j.entries.length)')
          # Hebrew ships as a lazy JSON bundle like the other locales.
          he_count=$(node -e 'console.log(Object.keys(JSON.parse(require("fs").readFileSync("src/i18n/locales/he.json","utf8"))).length)')
          diff=$(( en_count > he_count ? en_count - he_count : he_count - en_count ))
          echo "i18n keys — en: $en_count, he: $he_count, diff: $diff"
          if [ "$diff" -gt 10 ]; then
            echo "::error::i18n drift > 10 keys; run `node scripts/print-missing-i18n-keys.mjs` and fix."
            exit 1
          fi

  local-ai:
    name: local agents (fake Ollama)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Start the fake Ollama server
        run: |
          npm run -s fake-ollama -- --port 11434 > fake-ollama.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 0.5; done
          cat fake-ollama.log
      - name: Every agent once, over real HTTP
        # The eval cases run through the real runtime and the real Ollama
        # executor against the fake server; a wiring regression fails here
        # even though no model is involved. Model quality is measured by
        # `npm run eval:agents` on a machine with Ollama.
        env:
          LUMEN_EVAL_OLLAMA_URL: http://localhost:11434
          LUMEN_EVAL_MODEL: qwen2.5:7b
          LUMEN_EVAL_OUT: eval/results
          # The fake server can't judge language or format: prompt cases
          # check only that every prompt is answered (K1).
          LUMEN_EVAL_WIRING: "1"
        run: |
          npm run -s eval:agents
          # Compare with the committed baseline of the fake server: a case
          # that used to pass and fails now is a regression.
          npm run -s eval:compare -- eval/results/agents-*.json --baseline eval/baseline/agents-fake.json
          npm run -s eval:compare -- eval/results/prompts-*.json --baseline eval/baseline/prompts-fake.json
          node -e '
            const fs = require("fs");
            const f = fs.readdirSync("eval/results").find((n) => n.startsWith("agents-") && n.endsWith(".json"));
            const r = JSON.parse(fs.readFileSync("eval/results/" + f, "utf8"));
            const bad = r.results.filter((x) => x.status !== "ok" || x.checks.some((c) => !c.ok));
            console.log(`${r.results.length - bad.length}/${r.results.length} cases passed against the fake server`);
            if (bad.length) { console.error(bad.map((x) => `${x.id}: ${x.error ?? x.checks.filter((c) => !c.ok).map((c) => c.detail).join("; ")}`).join("\n")); process.exit(1); }
          '
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-agents-eval
          path: eval/results/
          if-no-files-found: ignore

  bundle-comment:
    name: bundle-size comment
    needs: check
    # Posts the table the check job produced. It checks out nothing and runs
    # no PR code, so it alone holds a write token. Fork PRs get a read-only
    # token: the table stays in the check job's summary.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: bundle-diff
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          [ -s bundle-diff.md ] || { echo "no bundle-size table"; exit 0; }
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- lumen-bundle-diff -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@bundle-diff.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@bundle-diff.md > /dev/null
          fi

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    # Lighthouse runs are slow + flaky on cold runners. Only required on
    # explicit triggers — main pushes and `lighthouse` PR labels — so day-to-day
    # PRs still get fast feedback from `check`.
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'lighthouse')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - run: npm run build
      - name: Lighthouse CI
        run: npx -y @lhci/cli@0.13.x autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  e2e:
    # Per-browser matrix: each browser runs in its own runner so the
    # three (chromium / firefox / webkit) execute in parallel. Before
    # this split, all three ran sequentially in one job and took 30+
    # minutes — past the timeout. Now each is ~10 min wall-clock, and
    # one failing browser doesn't cancel the others.
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Each browser independently: install + dev server cold-start +
    # tests. The dev server is slow on the Linux runner (~3 min to come
    # up vs. the prod static server's < 1s), so 20 min wasn't quite
    # enough for the slower browsers. 30 min gives comfortable headroom.
    timeout-minutes: 30
    needs: check
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Software GL for headless WebGL (firefox)
        # GitHub runners have no GPU; Firefox reports
        # FEATURE_FAILURE_WEBGL_EXHAUSTED_DRIVERS unless Mesa's llvmpipe is
        # present and selected. Chromium/WebKit ship their own fallbacks.
        if: matrix.browser == 'firefox'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libegl1 libgles2 mesa-utils
      - name: Run E2E (${{ matrix.browser }})
        env:
          LIBGL_ALWAYS_SOFTWARE: ${{ matrix.browser == 'firefox' && '1' || '' }}
          GALLIUM_DRIVER: ${{ matrix.browser == 'firefox' && 'llvmpipe' || '' }}
          PW_FIREFOX_HEADED: ${{ matrix.browser == 'firefox' && '1' || '' }}
        run: |
          if [ "${{ matrix.browser }}" = firefox ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
              npx playwright test --project=firefox --reporter=line,github,html
          else
            npx playwright test --project=${{ matrix.browser }} --reporter=line,github,html
          fi
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/

  e2e-prod:
    name: e2e against production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    # Vite dev mode and `vite preview` chunk modules differently;
    # round-16 found a critical TDZ that only fires in the prod
    # bundle. This job builds and serves the dist/ output, then
    # runs the same e2e suite against it — so the prod-bundle bug
    # class is regression-tested on every PR.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Install Playwright browsers (chromium only — saves ~6 min)
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Serve dist with http-server
        run: |
          # --cors: the Web Playground runner is an opaque-origin iframe,
          # so its module scripts need Access-Control-Allow-Origin (as the
          # production `_headers` / nginx config sends for /assets/*).
          npx -y http-server@14 dist -p 5180 -c-1 --cors --silent &
          # Wait for server to come up.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5180/ -o /dev/null; then
              echo "Server up."
              break
            fi
            sleep 1
          done
      - name: Run E2E against prod bundle
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5180
        run: npx playwright test --project=chromium --reporter=line,github,html
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod
          path: playwright-report/

  signal-health:
    name: signaling server health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Only on main pushes — the signaling server must be deployed first.
    if: github.event_name == 'push'
    steps:
      - name: Healthcheck
        run: |
          URL="${SIGNAL_URL:-https://signal.lumen.md}"
          echo "Checking $URL/healthz..."
          status=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$URL/healthz" || true)
          if [ "$status" = "200" ]; then
            echo "✅ Signal server healthy ($status)"
          else
            echo "::warning::Signaling server unreachable (HTTP $status). Deploy pending."
          fi
        env:
          SIGNAL_URL: ${{ vars.SIGNAL_URL || 'https://signal.lumen.md' }}
