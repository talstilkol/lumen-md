name: Issue triage

# Plan 14.3: every new issue is triaged within 24 hours — labels, a possible
# duplicate, a request for reproduction steps when a bug has none, and the
# plan task it belongs to (scripts/issue-triage.mjs). Runs when an issue is
# opened and once a day; the daily run also writes the report (the last day's
# issues, and any open issue older than 24 h that is still untriaged — that
# fails the run). Every action is pinned to a full commit SHA.
on:
  issues:
    types: [opened, reopened]
  schedule:
    - cron: "23 6 * * *" # 06:23 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-triage
  cancel-in-progress: false

jobs:
  triage:
    name: triage open issues
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/issue-triage.mjs --apply --json reports/issue-triage.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-issue-triage
          path: reports/
          retention-days: 90
