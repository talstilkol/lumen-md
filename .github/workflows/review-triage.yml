name: Review triage

# Nightly (plan 0.11): every open PR with its unresolved Codex review threads
# by severity, CI state and age (scripts/nightly/review-triage.mjs), then the
# owner's short digest of all the nightly reports (scripts/nightly/digest.mjs).
# Both go to the job summary and the reports-triage artifact. With the
# repository variable DIGEST_ISSUE set to an issue number (a pinned "Nightly
# digest" issue), the digest is also kept as one comment there. Nothing is
# committed.
on:
  schedule:
    - cron: "7 5 * * *" # 05:07 UTC, after the flake hunt and Lighthouse
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/review-triage.yml
      - scripts/nightly/review-triage.mjs
      - scripts/nightly/digest.mjs
      - scripts/nightly/lib.mjs

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: review-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    name: review triage + digest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Review triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/nightly/review-triage.mjs "$GITHUB_REPOSITORY"
      - name: Digest for the owner
        env:
          GH_TOKEN: ${{ github.token }}
          # The nightly reports run on the default branch; a PR run reports its own branch.
          DIGEST_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.event.repository.default_branch }}
          # Only scheduled / manual runs post the comment, never a PR run.
          DIGEST_ISSUE: ${{ github.event_name != 'pull_request' && vars.DIGEST_ISSUE || '' }}
        run: node scripts/nightly/digest.mjs "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-triage
          path: reports/
          retention-days: 90
