# Lumen on-prem deployment.
#
# Brings up the full self-hosted stack on a single VM:
#   - lumen-web      :80   (nginx serving the React SPA)
#   - lumen-signal   :4444 (y-webrtc signaling — peers find each other)
#   - lumen-collab   :4445 (persistent Hocuspocus, SQLite on the collab-data volume)
#   - lumen-billing  :4446 (Stripe webhook handler — optional)
#   - postgres       :5432 (billing entitlements + audit log; not used by lumen-collab)
#
# Prerequisites:
#   1. Copy .env.onprem.example → .env.onprem and fill in the secrets.
#   2. `docker compose --env-file .env.onprem up -d`
#   3. Point your DNS at this host:
#        lumen.example.com    → lumen-web
#        signal.example.com   → lumen-signal (or proxy via lumen-web)
#        collab.example.com   → lumen-collab
#        billing.example.com  → lumen-billing
#
# To skip optional services pass `--profile core` (omits billing).

version: "3.9"

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  lumen-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      # Baked into the SPA at build time (.env files aren't in the build
      # context). Point them at how browsers reach lumen-signal /
      # lumen-collab — see .env.onprem.example.
      args:
        VITE_WEBRTC_SIGNALING_URL: ${LUMEN_SIGNAL_URL:-}
        VITE_YJS_WEBSOCKET_URL: ${LUMEN_COLLAB_URL:-}
        VITE_AUDIT_ENDPOINT: ${LUMEN_AUDIT_URL:-}
    ports:
      - "80:80"
    depends_on:
      - lumen-signal
      - lumen-collab
    <<: [*restart, *logging]

  lumen-signal:
    build:
      context: ./sync-server
      dockerfile: Dockerfile
    ports:
      - "4444:4444"
    <<: [*restart, *logging]

  lumen-collab:
    build:
      context: .
      dockerfile: docker/Dockerfile.collab
    ports:
      - "4445:4445"
    environment:
      # Hocuspocus + SQLite (plan 3.6): collab.sqlite and backups/ on the
      # mounted volume. See docker/collab.yml to run it on its own.
      COLLAB_DATA_DIR: /data/collab
      # The operator access key (Collab settings → "Server access token"):
      # it buys a short-lived per-room token. Empty = open server (warned).
      COLLAB_ACCESS_KEY: ${LUMEN_COLLAB_TOKEN:-}
      # Signs the room tokens; never sent to the app. Random per start when unset.
      COLLAB_TOKEN_SECRET: ${LUMEN_COLLAB_TOKEN_SECRET:-}
    volumes:
      - collab-data:/data
    <<: [*restart, *logging]

  lumen-billing:
    profiles: ["billing"]
    build:
      context: .
      dockerfile: docker/Dockerfile.billing
    ports:
      - "4446:4446"
    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      DATABASE_URL: postgres://lumen:${LUMEN_PG_PASSWORD:-lumen}@postgres:5432/lumen
    depends_on:
      postgres:
        condition: service_healthy
    <<: [*restart, *logging]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: ${LUMEN_PG_PASSWORD:-lumen}
      POSTGRES_DB: lumen
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen"]
      interval: 10s
      timeout: 3s
      retries: 5
    <<: [*restart, *logging]

volumes:
  collab-data:
  postgres-data:
