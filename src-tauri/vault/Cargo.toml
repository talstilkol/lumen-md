[package]
name = "lumen-vault"
version = "0.1.0"
edition = "2021"
description = "The desktop vault (plan 4.3): one folder on disk, every path checked to stay inside it."
license = "MIT"
publish = false

# Plain std, no Tauri: `cargo test --manifest-path src-tauri/vault/Cargo.toml`
# runs on any OS without the WebView libraries.
[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
