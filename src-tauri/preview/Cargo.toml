[package]
name = "lumen-preview"
version = "0.1.0"
edition = "2021"
description = "Previews of Lumen's files outside the app (plan W13.K2): Markdown, .excalidraw and .base for macOS Quick Look and the Windows preview pane. Plain std, no dependencies."
license = "MIT"
publish = false

# A static library for the Quick Look extension (Swift calls lumen_preview_render),
# and an rlib for Rust callers. `rustc --edition 2021 --test src-tauri/preview/src/lib.rs` runs the tests anywhere.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
