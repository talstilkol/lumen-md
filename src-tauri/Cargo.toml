[workspace]
members = ["keychain"]

[package]
name = "lumen"
version = "0.1.0"
description = "Lumen — markdown, illuminated"
authors = ["Lumen contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# OS keychain for API keys and tokens (T36): Keychain on macOS, Credential
# Manager on Windows, in its own crate (keychain/) so CI tests it on both
# without building Tauri (plan 2.5).
lumen-keychain = { path = "keychain" }

[features]
custom-protocol = ["tauri/custom-protocol"]
