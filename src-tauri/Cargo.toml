[package]
name = "lumen"
version = "0.1.0"
description = "Lumen — markdown, illuminated"
authors = ["Lumen contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Web clipper v2 (plan 4.15.2): the extension hands clips to the desktop app
# as lumen://clip?data=…; a second launch forwards the link to the running one.
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# OS keychain for API keys and tokens (T36): Keychain on macOS, Credential
# Manager on Windows. Linux keeps the WebCrypto store (keyutils is per-session
# and Secret Service needs D-Bus at build time).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
