<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumen Web Clipper — Settings</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        max-width: 520px;
        font-family: -apple-system, system-ui, sans-serif;
        background: #0d0d18;
        color: #e8e8f0;
      }
      h1 {
        font-size: 1.4rem;
        letter-spacing: -0.01em;
      }
      label {
        display: block;
        margin-top: 16px;
        font-size: 13px;
        color: #8888a8;
      }
      input[type="text"] {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid #2a2a3e;
        border-radius: 8px;
        background: #14141f;
        color: #e8e8f0;
        font-size: 13px;
      }
      .save {
        margin-top: 20px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #7c5cff, #22d3ee);
        color: white;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      .ok {
        display: inline-block;
        margin-inline-start: 12px;
        font-size: 12px;
        color: #4ade80;
        opacity: 0;
        transition: opacity 200ms ease;
      }
      .ok.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <h1>Lumen Web Clipper — Settings</h1>
    <p style="color: #8888a8; font-size: 13px">
      Point this extension at the URL where Lumen is running. Localhost works
      for the dev server; replace with your hosted instance for production.
    </p>

    <label for="url">Lumen URL</label>
    <input id="url" type="text" placeholder="http://localhost:5173" />

    <button class="save" id="save">Save</button>
    <span class="ok" id="ok">Saved ✓</span>

    <script>
      const input = document.getElementById("url");
      const ok = document.getElementById("ok");
      chrome.storage.local.get({ lumenUrl: "http://localhost:5173" }).then(({ lumenUrl }) => {
        input.value = lumenUrl;
      });
      document.getElementById("save").addEventListener("click", async () => {
        await chrome.storage.local.set({ lumenUrl: input.value.trim() });
        ok.classList.add("show");
        setTimeout(() => ok.classList.remove("show"), 1200);
      });
    </script>
  </body>
</html>
