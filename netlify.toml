[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (incl. the CSP) come from dist/_headers — public/_headers
# copied into the build and extended at build time with this deployment's
# worker origins (src/build/cspEndpoints.ts). Netlify applies _headers from
# the publish directory; keeping a second static CSP here would be enforced
# too and block those origins.
#
# Known limitation: Netlify's _headers grammar can't detach the catch-all
# headers (Cloudflare's `! Header`), so /playground-runner.html inherits the
# app's X-Frame-Options / CSP and the Web Playground block can't run here.
# Use Cloudflare Pages, Vercel or the Docker image for the playground.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
