[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (incl. the CSP) come from dist/_headers — public/_headers
# copied into the build and extended at build time with this deployment's
# worker origins (src/build/cspEndpoints.ts). Netlify applies _headers from
# the publish directory; keeping a second static CSP here would be enforced
# too and block those origins.
#
# Netlify's _headers grammar cannot detach the catch-all headers (Cloudflare's
# `! Header`), so the two runner pages would inherit the app's X-Frame-Options
# and CSP and the Web Playground / live-js blocks could not run here. The edge
# function below replaces those two headers for those two paths with the
# runner policies from security/policy.json (plan 13.2).
[[edge_functions]]
  path = "/playground-runner.html"
  function = "runner-headers"

[[edge_functions]]
  path = "/livejs-runner.html"
  function = "runner-headers"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
